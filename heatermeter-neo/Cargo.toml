[workspace]
resolver = "3"
members = ["crates/hm-protocol", "crates/lm-core", "crates/hm-sim", "crates/linkmeterd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/CapnBry/HeaterMeter"

[workspace.dependencies]
hm-protocol = { path = "crates/hm-protocol" }
lm-core = { path = "crates/lm-core" }
hm-sim = { path = "crates/hm-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
